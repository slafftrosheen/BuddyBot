; PlatformIO project for BuddyBot

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib
lib_deps =
    m5stack/M5Unified @ ^0.1.11
    m5stack/M5GFX @ ^0.1.11
    Wire
    mathieucarbou/ESPAsyncWebServer @ ^3.2.3
    mathieucarbou/AsyncTCP @ ^3.2.4
    bblanchon/ArduinoJson @ ^7.1.0
    m5stack/M5Unit-Sonic
build_flags =
    -Ilib/M5_UNIT_8SERVO
    -Isrc

[env:buddybot_safe]
build_flags =
    ${env.build_flags}
; Apply -fno-rtti to C++ files only (avoids cc1 warnings in M5GFX C files)
build_src_flags =
    -std=gnu++17
    -fno-rtti

[env:buddybot_bench]
build_flags =
    ${env.build_flags}
    -D ENABLE_BENCH_TESTING=1
