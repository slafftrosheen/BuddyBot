; PlatformIO project for Halo BuddyBot

[platformio]
default_envs = buddybot_safe
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    m5stack/M5GFX @ ^0.2.0
    m5stack/M5PM1
    Wire
    WiFi
    FS
    mathieucarbou/ESPAsyncWebServer @ 3.2.3
    mathieucarbou/AsyncTCP @ 3.2.4
    bblanchon/ArduinoJson @ 7.1.0
    m5stack/M5Unit-Sonic
lib_ldf_mode = deep
build_flags =
    -Ilib/M5_UNIT_8SERVO
    -Isrc
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DM5GFX_BOARD=board_M5StickS3

[env:buddybot_safe]
build_flags =
    ${env.build_flags}
; Apply -fno-rtti to C++ files only (avoids cc1 warnings in M5GFX C files)
build_src_flags =
    -std=gnu++17
    -fno-rtti

[env:buddybot_bench]
build_flags =
    ${env.build_flags}
    -D ENABLE_BENCH_TESTING=1

[env:buddybot_test]
build_flags =
    ${env.build_flags}
    -std=gnu++17
test_build_src = yes
build_src_filter =
    +<ControlProtocol.cpp>
    +<WebControlProtocol.cpp>
    +<SafetySupervisor.cpp>
    +<RuntimeSnapshot.cpp>
    +<RuntimeCapabilities.cpp>
    +<IntentResolver.cpp>
    +<CommandExecutor.cpp>
    +<CognitiveContext.cpp>
    +<CognitiveDecision.cpp>
    +<ReasoningEngine.cpp>
    +<RuleReasoningProvider.cpp>
